{
  "model": {
    "default": "gpt-5.6-luna",
    "provider": "openai-codex"
  },
  "agent": {
    "max_turns": 90,
    "reasoning_overrides": "{\"gpt-5.6-luna\":\"max\"}",
    "service_tier": "priority"
  },
  "terminal": {
    "cwd": "/home/USER"
  },
  "toolsets": [
    "hermes-cli",
    "kanban"
  ],
  "kanban": {
    "auto_decompose": false,
    "orchestrator_profile": "agent-orchestrator",
    "default_assignee": "ai-researcher"
  }
}